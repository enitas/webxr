<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escape Game AR - Cavalier 3D Sur Mesure</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      touch-action: none;
    }
    body {
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      padding: 14px 20px;
      background: rgba(18, 14, 12, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 14px;
      color: #e2d1c3;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 10;
      pointer-events: none;
    }
    #status-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 4px;
    }
    #status-desc {
      font-size: 13px;
      color: #cbd5e1;
    }

    #start-btn {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: none;
      border-radius: 30px;
      color: #0d0f14;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
      z-index: 10;
      pointer-events: auto;
    }
    #start-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <div id="status-title">RECHERCHE EN COURS</div>
    <div id="status-desc">Pointez la caméra vers l'image cible.</div>
  </div>

  <button id="start-btn">DÉMARRER L'EXPÉRIENCE</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');
    const startBtn = document.getElementById('start-btn');

    // 1. INITIALISATION MINDAR
    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: "./targets.mind"
    });

    const { renderer, scene, camera } = mindarThree;

    // Réglage du rendu pour des couleurs et ombres réalistes
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    // 2. ÉCLAIRAGE DE STUDIO
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xfff5ea, 1.8);
    mainLight.position.set(3, 5, 4);
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.8);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);

    const bottomLight = new THREE.DirectionalLight(0xffeedd, 2.5);
    bottomLight.position.set(0, -5, 0); // Éclairage du dessous pour lire le code
    scene.add(bottomLight);

    // 3. TEXTURE GRAVÉE DU CODE SOUS LE SOCLE
    function createBottomNumberTexture(numberStr) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#11100e';
      ctx.beginPath();
      ctx.arc(256, 256, 250, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 18;
      ctx.stroke();

      const fontSize = numberStr.length >= 3 ? 130 : 190;
      ctx.fillStyle = '#f3e5ab';
      ctx.font = `Bold ${fontSize}px Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(numberStr, 256, 256);

      return new THREE.CanvasTexture(canvas);
    }

    // 4. GROUPE PRINCIPAL ET CHARGEMENT DU FICHIER .GLB
    const mainGroup = new THREE.Group();
    const SECRET_NUMBER = "314";

    const loader = new GLTFLoader();

    function loadCustomGLB() {
      return new Promise((resolve, reject) => {
        loader.load('./cavalier.glb', (gltf) => {
          const model = gltf.scene;

          // CALCUL DE LA BOÎTE ENGLOBANTE (Bounding Box)
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          // Recentrage précis du modèle 3D au point (0, 0, 0)
          model.position.x -= center.x;
          model.position.y -= box.min.y; // Aligne la base sur y = 0
          model.position.z -= center.z;

          // Normalisation automatique de la taille (hauteur cible ~0.8 unité)
          const maxDim = Math.max(size.x, size.y, size.z);
          const targetScale = 0.8 / maxDim;
          model.scale.setScalar(targetScale);

          // CRÉATION DU SOCLE GRAVÉ SOUS LA PIÈCE (adapté à la largeur du modèle)
          const baseRadius = (Math.max(size.x, size.z) * targetScale) / 2;
          const bottomGeo = new THREE.CircleGeometry(Math.max(baseRadius, 0.25), 36);
          const numTexture = createBottomNumberTexture(SECRET_NUMBER);
          const bottomMat = new THREE.MeshBasicMaterial({ map: numTexture, side: THREE.DoubleSide });
          const bottomMesh = new THREE.Mesh(bottomGeo, bottomMat);
          
          bottomMesh.rotation.x = Math.PI / 2;
          bottomMesh.position.y = -0.005; // Placé juste sous la pièce

          const modelContainer = new THREE.Group();
          modelContainer.add(model);
          modelContainer.add(bottomMesh);

          // Recentrer le pivot global du groupe pour que la rotation tourne autour du centre du cavalier
          modelContainer.position.y = -(size.y * targetScale) / 2;

          mainGroup.add(modelContainer);
          resolve();
        }, undefined, (error) => {
          reject("Impossible de charger 'cavalier.glb'. Vérifiez le nom et l'emplacement du fichier.");
        });
      });
    }

    // ANCRAGE MINDAR
    const anchor = mindarThree.addAnchor(0);
    anchor.group.add(mainGroup);

    anchor.onTargetFound = () => {
      statusTitle.textContent = "CAVALIER DÉTECTÉ";
      statusTitle.style.color = "#d4af37";
      statusDesc.textContent = "Pincez pour zoomer. Tournez la pièce pour inspecter le dessous.";
    };

    anchor.onTargetLost = () => {
      statusTitle.textContent = "RECHERCHE EN COURS";
      statusTitle.style.color = "#ffaa00";
      statusDesc.textContent = "Pointez la caméra vers l'image cible.";
    };

    // 5. CONTRÔLES TACTILES FLUIDES (ROTATION 360° & ZOOM)
    let currentScale = 1.0;
    let isPointerDown = false;
    let lastPointerX = 0, lastPointerY = 0;
    let initialPinchDistance = null;

    function getTouchDistance(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    // Zoom molette (Desktop)
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      currentScale = Math.max(0.3, Math.min(3.5, currentScale * zoomFactor));
      mainGroup.scale.set(currentScale, currentScale, currentScale);
    }, { passive: false });

    // Tactile Mobile
    window.addEventListener('touchstart', (e) => {
      if (e.target.id === 'start-btn') return;

      if (e.touches.length === 1) {
        isPointerDown = true;
        lastPointerX = e.touches[0].clientX;
        lastPointerY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isPointerDown = false;
        initialPinchDistance = getTouchDistance(e);
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isPointerDown) {
        const dx = e.touches[0].clientX - lastPointerX;
        const dy = e.touches[0].clientY - lastPointerY;

        mainGroup.rotation.y += dx * 0.01;
        mainGroup.rotation.x += dy * 0.01;

        lastPointerX = e.touches[0].clientX;
        lastPointerY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const newDist = getTouchDistance(e);
        const factor = newDist / initialPinchDistance;
        initialPinchDistance = newDist;

        currentScale = Math.max(0.3, Math.min(3.5, currentScale * factor));
        mainGroup.scale.set(currentScale, currentScale, currentScale);
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
      if (e.touches.length === 0) isPointerDown = false;
    });

    // Souris PC
    let isMouseDown = false;
    window.addEventListener('mousedown', (e) => {
      if (e.target.id === 'start-btn') return;
      isMouseDown = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;

      mainGroup.rotation.y += dx * 0.01;
      mainGroup.rotation.x += dy * 0.01;

      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; });

    // DÉMARRAGE
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      statusTitle.textContent = "CHARGEMENT";
      statusDesc.textContent = "Chargement du fichier cavalier.glb...";

      try {
        const response = await fetch('./targets.mind');
        if (!response.ok) throw new Error("Fichier 'targets.mind' introuvable.");

        await loadCustomGLB();
        await mindarThree.start();

        statusTitle.textContent = "RECHERCHE EN COURS";
        statusDesc.textContent = "Pointez la caméra vers l'image cible.";

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error(err);
        statusTitle.textContent = "ERREUR";
        statusTitle.style.color = "#ff4444";
        statusDesc.textContent = typeof err === 'string' ? err : err.message;
      }
    });
  </script>
</body>
</html>
