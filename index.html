<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escape Game AR - Cadenas 3D</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      touch-action: none; /* Empêche le défilement de la page sur mobile */
    }
    body {
      overflow: hidden;
      background-color: #08080c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      padding: 14px 20px;
      background: rgba(15, 18, 28, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 16px;
      color: #ffffff;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 10;
      pointer-events: none; /* Laisse passer les clics au canevas 3D */
    }
    #status-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #d4af37;
      margin-bottom: 4px;
    }
    #status-desc {
      font-size: 13px;
      color: #cbd5e1;
    }

    #start-btn {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: none;
      border-radius: 30px;
      color: #0d0f14;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
      z-index: 10;
      pointer-events: auto;
    }
    #start-btn:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <div id="status-title">Initialisation</div>
    <div id="status-desc">Cliquez sur le bouton pour démarrer la caméra.</div>
  </div>

  <button id="start-btn">DÉMARRER L'EXPÉRIENCE</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');
    const startBtn = document.getElementById('start-btn');

    // 1. INITIALISATION MINDAR
    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: "./targets.mind"
    });

    const { renderer, scene, camera } = mindarThree;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    // 2. ÉCLAIRAGE
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xfff8e7, 2.5);
    dirLight1.position.set(3, 5, 4);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x90b0ff, 1.0);
    dirLight2.position.set(-3, -2, 2);
    scene.add(dirLight2);

    // 3. AUDIO SPATIAL
    const listener = new THREE.AudioListener();
    camera.add(listener);

    function unlockAudio() {
      if (listener.context.state === 'suspended') {
        listener.context.resume();
      }
    }

    function createClickBuffer(audioCtx) {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * 0.04, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / sampleRate;
        data[i] = Math.sin(2 * Math.PI * 320 * t) * Math.exp(-t * 110);
      }
      return buffer;
    }

    function createSuccessBuffer(audioCtx) {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * 0.5, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / sampleRate;
        const freq = 440 + (t / 0.5) * 440;
        data[i] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-t * 4);
      }
      return buffer;
    }

    const positionalClick = new THREE.PositionalAudio(listener);
    const positionalSuccess = new THREE.PositionalAudio(listener);

    positionalClick.setBuffer(createClickBuffer(listener.context));
    positionalClick.setRefDistance(0.5);

    positionalSuccess.setBuffer(createSuccessBuffer(listener.context));
    positionalSuccess.setRefDistance(0.5);

    // 4. ASSEMBLAGE DU CADENAS ET GROUPE INTERACTIF
    const padlockGroup = new THREE.Group();
    padlockGroup.scale.set(0.85, 0.85, 0.85);

    padlockGroup.add(positionalClick);
    padlockGroup.add(positionalSuccess);

    // MATÉRIAUX
    const brassMat = new THREE.MeshStandardMaterial({ color: 0xc89d2a, metalness: 0.85, roughness: 0.25 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 0.95, roughness: 0.1 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x181a20, metalness: 0.8, roughness: 0.4 });

    // A. Corps du cadenas
    const shape = new THREE.Shape();
    const w = 0.46, h = 0.32, r = 0.04;
    shape.moveTo(-w/2 + r, -h/2);
    shape.lineTo(w/2 - r, -h/2);
    shape.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r);
    shape.lineTo(w/2, h/2 - r);
    shape.quadraticCurveTo(w/2, h/2, w/2 - r, h/2);
    shape.lineTo(-w/2 + r, h/2);
    shape.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r);
    shape.lineTo(-w/2, -h/2 + r);
    shape.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);

    const bodyGeo = new THREE.ExtrudeGeometry(shape, {
      depth: 0.10,
      bevelEnabled: true,
      bevelThickness: 0.01,
      bevelSize: 0.01,
      bevelSegments: 3
    });
    bodyGeo.center();
    const body = new THREE.Mesh(bodyGeo, brassMat);
    padlockGroup.add(body);

    // B. Logement molettes
    const slotGeo = new THREE.BoxGeometry(0.38, 0.14, 0.04);
    const slot = new THREE.Mesh(slotGeo, darkMat);
    slot.position.set(0, -0.01, 0.042);
    padlockGroup.add(slot);

    // C. Bagues de finition fixes
    const collarGeo = new THREE.CylinderGeometry(0.028, 0.028, 0.02, 24);
    const collarL = new THREE.Mesh(collarGeo, brassMat);
    collarL.position.set(-0.12, 0.165, 0);
    const collarR = new THREE.Mesh(collarGeo, brassMat);
    collarR.position.set(0.12, 0.165, 0);
    padlockGroup.add(collarL);
    padlockGroup.add(collarR);

    // D. Diode LED
    const ledMat = new THREE.MeshStandardMaterial({
      color: 0xff0033,
      emissive: 0xff0022,
      emissiveIntensity: 2.0,
      roughness: 0.2
    });
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.014, 16, 16), ledMat);
    led.position.set(0, 0.11, 0.052);
    padlockGroup.add(led);

    // E. Anse avec tiges coulissantes longues
    const shackleGroup = new THREE.Group();
    shackleGroup.position.set(0, 0.07, 0);

    const arch = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.021, 16, 32, Math.PI), chromeMat);
    arch.position.set(0, 0.11, 0);
    shackleGroup.add(arch);

    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.021, 0.22, 24), chromeMat);
    legL.position.set(-0.12, 0.0, 0);
    shackleGroup.add(legL);

    const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.021, 0.22, 24), chromeMat);
    legR.position.set(0.12, 0.0, 0);
    shackleGroup.add(legR);

    padlockGroup.add(shackleGroup);

    // F. TEXTURE MOLETTES
    function createDigitTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1280;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#22252e';
      ctx.fillRect(0, 0, 1280, 128);

      ctx.fillStyle = '#d4af37';
      ctx.fillRect(0, 0, 1280, 5);
      ctx.fillRect(0, 123, 1280, 5);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'Bold 76px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < 10; i++) {
        ctx.save();
        ctx.translate(i * 128 + 64, 64);
        ctx.rotate(Math.PI / 2);
        ctx.fillText(i.toString(), 0, 0);
        ctx.restore();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      return texture;
    }

    // G. MOLETTES
    const wheels = [];
    const currentDigits = [0, 0, 0, 0];
    const targetRotations = [0, 0, 0, 0];
    const SECRET_CODE = "4207";
    const digitTexture = createDigitTexture();

    const wheelGeo = new THREE.CylinderGeometry(0.046, 0.046, 0.068, 32);
    wheelGeo.rotateZ(Math.PI / 2);

    for (let i = 0; i < 4; i++) {
      const wheelMat = new THREE.MeshStandardMaterial({ map: digitTexture, metalness: 0.6, roughness: 0.3 });
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      
      wheel.position.set(-0.135 + i * 0.09, -0.01, 0.038);
      wheel.userData = { index: i };
      
      padlockGroup.add(wheel);
      wheels.push(wheel);
    }

    // ANCRAGE MINDAR
    const anchor = mindarThree.addAnchor(0);
    anchor.group.add(padlockGroup);

    anchor.onTargetFound = () => {
      statusTitle.textContent = "CIBLE DÉTECTÉE";
      statusTitle.style.color = "#d4af37";
      statusDesc.textContent = "Composez le code secret (4207). Vous pouvez glisser pour tourner le cadenas.";
    };

    anchor.onTargetLost = () => {
      statusTitle.textContent = "RECHERCHE EN COURS";
      statusTitle.style.color = "#ffaa00";
      statusDesc.textContent = "Pointez la caméra vers l'image du livre.";
    };

    // LOGIQUE DE DÉVERROUILLAGE
    function rotateWheel(index) {
      unlockAudio();
      currentDigits[index] = (currentDigits[index] + 1) % 10;
      targetRotations[index] = currentDigits[index] * (Math.PI * 2 / 10);

      if (positionalClick.isPlaying) positionalClick.stop();
      positionalClick.play();

      checkCode();
    }

    let isUnlocked = false;
    let targetShackleY = 0.07;

    function checkCode() {
      if (currentDigits.join('') === SECRET_CODE && !isUnlocked) {
        isUnlocked = true;
        targetShackleY = 0.18;

        ledMat.color.setHex(0x00ff88);
        ledMat.emissive.setHex(0x00ff88);
        ledMat.emissiveIntensity = 3.0;

        statusTitle.textContent = "DÉVERROUILLÉ !";
        statusTitle.style.color = "#00ff88";
        statusDesc.textContent = "Bravo, la combinaison est correcte.";

        if (positionalSuccess.isPlaying) positionalSuccess.stop();
        positionalSuccess.play();
      }
    }

    // 5. GESTION DES GESTES (ROTATION, ZOOM, CLIC MOLETTES)
    let isPointerDown = false;
    let pointerStartX = 0, pointerStartY = 0;
    let hasDragged = false;
    let initialPinchDistance = null;
    let initialScale = padlockGroup.scale.x;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Zoom à la molette sur ordinateur
    window.addEventListener('wheel', (e) => {
      let scale = padlockGroup.scale.x - e.deltaY * 0.001;
      scale = Math.max(0.3, Math.min(2.5, scale));
      padlockGroup.scale.set(scale, scale, scale);
    }, { passive: true });

    // Début de contact (souris / 1 ou 2 doigts)
    window.addEventListener('pointerdown', (e) => {
      if (e.target.id === 'start-btn') return;
      unlockAudio();

      isPointerDown = true;
      hasDragged = false;
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
    });

    // Déplacement
    window.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;

      const dx = e.clientX - pointerStartX;
      const dy = e.clientY - pointerStartY;

      // Si le doigt bouge de plus de 5px, c'est une rotation et non un simple clic
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        hasDragged = true;
      }

      if (hasDragged) {
        padlockGroup.rotation.y += dx * 0.008;
        padlockGroup.rotation.x += dy * 0.008;

        // Limiter la rotation verticale pour éviter les retournements bizarres
        padlockGroup.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, padlockGroup.rotation.x));

        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
      }
    });

    // Fin du contact
    window.addEventListener('pointerup', (e) => {
      if (e.target.id === 'start-btn') return;

      if (!hasDragged && isPointerDown) {
        // Clic simple : tester l'interaction avec les molettes
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(wheels);

        if (intersects.length > 0) {
          rotateWheel(intersects[0].object.userData.index);
        }
      }

      isPointerDown = false;
      initialPinchDistance = null;
    });

    // Pincer pour zoomer (sur mobile)
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        hasDragged = true;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (!initialPinchDistance) {
          initialPinchDistance = distance;
          initialScale = padlockGroup.scale.x;
        } else {
          const factor = distance / initialPinchDistance;
          let newScale = initialScale * factor;
          newScale = Math.max(0.3, Math.min(2.5, newScale));
          padlockGroup.scale.set(newScale, newScale, newScale);
        }
      }
    }, { passive: true });

    // DÉMARRAGE DE L'APPLICATION
    startBtn.addEventListener('click', async () => {
      unlockAudio();
      startBtn.style.display = 'none';
      statusTitle.textContent = "CHARGEMENT";
      statusDesc.textContent = "Initialisation du moteur 3D...";

      try {
        const response = await fetch('./targets.mind');
        if (!response.ok) throw new Error("Fichier 'targets.mind' introuvable.");

        await mindarThree.start();
        statusTitle.textContent = "RECHERCHE EN COURS";
        statusTitle.style.color = "#ffaa00";
        statusDesc.textContent = "Pointez la caméra vers l'image du livre.";

        renderer.setAnimationLoop(() => {
          // Rotation fluide des molettes
          for (let i = 0; i < 4; i++) {
            wheels[i].rotation.x += (targetRotations[i] - wheels[i].rotation.x) * 0.2;
          }

          // Coulissement de l'anse
          shackleGroup.position.y += (targetShackleY - shackleGroup.position.y) * 0.1;

          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error(err);
        statusTitle.textContent = "ERREUR";
        statusTitle.style.color = "#ff4444";
        statusDesc.textContent = err.message;
      }
    });
  </script>
</body>
</html>
