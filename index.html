<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escape Game AR - Cadenas à Molettes</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #0d0d11;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      padding: 14px 20px;
      background: rgba(18, 18, 28, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      color: #ffffff;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      z-index: 10;
    }
    #status-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #a0a5c0;
      margin-bottom: 4px;
    }
    #status-desc {
      font-size: 13px;
      color: #e0e6ff;
    }

    #start-btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 36px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      border: none;
      border-radius: 30px;
      color: #000000;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(79, 172, 254, 0.4);
      z-index: 10;
    }
    #start-btn:active {
      transform: translateX(-50%) scale(0.95);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>

  <div id="hud">
    <div id="status-title">Prêt à démarrer</div>
    <div id="status-desc">Cliquez sur le bouton ci-dessous pour lancer l'expérience AR.</div>
  </div>

  <button id="start-btn">DÉMARRER L'EXPÉRIENCE</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const statusTitle = document.getElementById('status-title');
    const statusDesc = document.getElementById('status-desc');
    const startBtn = document.getElementById('start-btn');

    // INITIALISATION MINDAR
    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: "./targets.mind"
    });

    const { renderer, scene, camera } = mindarThree;

    // ÉCLAIRAGE
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight.position.set(2, 5, 4);
    scene.add(dirLight);

    // AUDIO SPATIAL
    const listener = new THREE.AudioListener();
    camera.add(listener);

    function unlockAudio() {
      if (listener.context.state === 'suspended') {
        listener.context.resume();
      }
    }

    function createClickBuffer(audioCtx) {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * 0.05, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / sampleRate;
        data[i] = Math.sin(2 * Math.PI * 300 * t) * Math.exp(-t * 100);
      }
      return buffer;
    }

    function createSuccessBuffer(audioCtx) {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * 0.5, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / sampleRate;
        const freq = 523.25 + (t / 0.5) * 523.25;
        data[i] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-t * 4);
      }
      return buffer;
    }

    const positionalClick = new THREE.PositionalAudio(listener);
    const positionalSuccess = new THREE.PositionalAudio(listener);

    positionalClick.setBuffer(createClickBuffer(listener.context));
    positionalClick.setRefDistance(0.5);

    positionalSuccess.setBuffer(createSuccessBuffer(listener.context));
    positionalSuccess.setRefDistance(0.5);

    // CADENAS 3D (STRUCTURE ET ALIGNEMENT)
    const padlockGroup = new THREE.Group();
    padlockGroup.scale.set(0.75, 0.75, 0.75);

    padlockGroup.add(positionalClick);
    padlockGroup.add(positionalSuccess);

    // 1. Corps du cadenas en laiton
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0xd4af37, shininess: 80 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.36, 0.12), bodyMat);
    padlockGroup.add(body);

    // 2. Plaque noire arrière pour les molettes
    const slotMat = new THREE.MeshBasicMaterial({ color: 0x111116 });
    const slotPlate = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.16, 0.02), slotMat);
    slotPlate.position.set(0, 0, 0.051);
    padlockGroup.add(slotPlate);

    // 3. Anse chromée
    const shackleMat = new THREE.MeshPhongMaterial({ color: 0xe6e6e6, shininess: 120 });
    const shackle = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.024, 16, 32, Math.PI), shackleMat);
    shackle.position.set(0, 0.18, 0);
    padlockGroup.add(shackle);

    // 4. Génération de la texture des chiffres (Bien orientés)
    function createDigitTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1280;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      // Fond argenté / gris très clair
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(0, 0, 1280, 128);

      // Lignes de séparation haut et bas
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 0, 1280, 8);
      ctx.fillRect(0, 120, 1280, 8);

      // Dessin des chiffres 0 à 9
      ctx.fillStyle = '#0f172a';
      ctx.font = '900 76px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < 10; i++) {
        ctx.save();
        ctx.translate(i * 128 + 64, 64);
        ctx.rotate(Math.PI / 2); // Orienté pour l'axe horizontal
        ctx.fillText(i.toString(), 0, 0);
        ctx.restore();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      return texture;
    }

    // 5. Création des 4 molettes (Axe X horizontal)
    const wheels = [];
    const currentDigits = [0, 0, 0, 0];
    const SECRET_CODE = "4207";
    const digitTexture = createDigitTexture();

    // Géométrie tournée de 90° sur Z pour que le cylindre soit couché horizontalement
    const wheelGeo = new THREE.CylinderGeometry(0.052, 0.052, 0.075, 32);
    wheelGeo.rotateZ(Math.PI / 2);

    for (let i = 0; i < 4; i++) {
      const wheelMat = new THREE.MeshPhongMaterial({ map: digitTexture, shininess: 50 });
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      
      // Alignement parfait des 4 molettes sur la face avant
      wheel.position.set(-0.16 + i * 0.106, 0, 0.04);
      wheel.userData = { index: i };
      
      padlockGroup.add(wheel);
      wheels.push(wheel);
    }

    // ANCRAGE IMAGE
    const anchor = mindarThree.addAnchor(0);
    anchor.group.add(padlockGroup);

    anchor.onTargetFound = () => {
      statusTitle.textContent = "Cible Détectée !";
      statusTitle.style.color = "#00ff88";
      statusDesc.textContent = "Composez le code secret (4207) en touchant les 4 molettes.";
    };

    anchor.onTargetLost = () => {
      statusTitle.textContent = "Recherche d'image";
      statusTitle.style.color = "#ffcc00";
      statusDesc.textContent = "Pointez la caméra vers l'image du livre.";
    };

    // LOGIQUE DE ROTATION (Défilement vertical sur l'axe X)
    function rotateWheel(index) {
      unlockAudio();
      currentDigits[index] = (currentDigits[index] + 1) % 10;
      
      // Rotation propre autour de l'axe X
      wheels[index].rotation.x = currentDigits[index] * (Math.PI * 2 / 10);

      if (positionalClick.isPlaying) positionalClick.stop();
      positionalClick.play();

      checkCode();
    }

    function checkCode() {
      if (currentDigits.join('') === SECRET_CODE) {
        shackle.position.y = 0.30; // L'anse monte
        bodyMat.color.setHex(0x10b981); // Le cadenas devient vert
        statusTitle.textContent = "DÉVERROUILLÉ !";
        statusTitle.style.color = "#00ff88";
        statusDesc.textContent = "Bravo, vous avez ouvert le cadenas !";

        if (positionalSuccess.isPlaying) positionalSuccess.stop();
        positionalSuccess.play();
      }
    }

    // DÉTECTION DU CLIC TACTILE
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function handleInteraction(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(wheels);

      if (intersects.length > 0) {
        rotateWheel(intersects[0].object.userData.index);
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.closest('#hud')) return;
      unlockAudio();
      handleInteraction(e.clientX, e.clientY);
    });

    // DÉMARRAGE DU SCRIPT
    startBtn.addEventListener('click', async () => {
      unlockAudio();
      startBtn.style.display = 'none';
      statusTitle.textContent = "Chargement des cibles...";
      statusDesc.textContent = "Analyse du fichier targets.mind...";

      try {
        const response = await fetch('./targets.mind');
        if (!response.ok) {
          throw new Error("Fichier 'targets.mind' introuvable sur le serveur.");
        }

        await mindarThree.start();
        statusTitle.textContent = "Recherche d'image";
        statusTitle.style.color = "#ffcc00";
        statusDesc.textContent = "Pointez votre caméra vers l'image du livre.";

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error(err);
        statusTitle.textContent = "Erreur de chargement";
        statusTitle.style.color = "#ff4444";
        statusDesc.textContent = err.message;
      }
    });
  </script>
</body>
</html>
