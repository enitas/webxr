<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escape Game WebXR - Cadenas 3D AR</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      color: #ffffff;
      z-index: 10;
      pointer-events: none;
      font-size: 15px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">Touchez les molettes pour composer le code (4207)</div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    // 1. SCÈNE & MOTEUR DE RENDU
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 0.85);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // BOUTON AR (avec optionalFeatures au lieu de requiredFeatures)
    const arButton = ARButton.createButton(renderer, {
      optionalFeatures: ['hit-test', 'dom-overlay'],
      domOverlay: { root: document.body }
    });
    document.body.appendChild(arButton);

    // ÉCLAIRAGE
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(1, 2, 2);
    scene.add(dirLight);

    // 2. AUDIO SPATIALISÉ
    const listener = new THREE.AudioListener();
    camera.add(listener);

    function unlockAudio() {
      if (listener.context.state === 'suspended') {
        listener.context.resume();
      }
    }

    function createClickBuffer(audioCtx) {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * 0.05, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / sampleRate;
        data[i] = Math.sin(2 * Math.PI * 200 * t) * Math.exp(-t * 90);
      }
      return buffer;
    }

    function createSuccessBuffer(audioCtx) {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * 0.35, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / sampleRate;
        const freq = 440 + (t / 0.35) * 440;
        data[i] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-t * 6);
      }
      return buffer;
    }

    const positionalClick = new THREE.PositionalAudio(listener);
    const positionalSuccess = new THREE.PositionalAudio(listener);

    positionalClick.setBuffer(createClickBuffer(listener.context));
    positionalClick.setRefDistance(0.5);
    positionalClick.setRolloffFactor(2);

    positionalSuccess.setBuffer(createSuccessBuffer(listener.context));
    positionalSuccess.setRefDistance(0.5);
    positionalSuccess.setRolloffFactor(2);

    // 3. CONSTRUCTION DU CADENAS 3D
    const padlockGroup = new THREE.Group();
    padlockGroup.position.set(0, 0, -0.6);
    scene.add(padlockGroup);

    padlockGroup.add(positionalClick);
    padlockGroup.add(positionalSuccess);

    const bodyMat = new THREE.MeshPhongMaterial({ color: 0xb8860b, shininess: 40 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.15), bodyMat);
    padlockGroup.add(body);

    const shackleMat = new THREE.MeshPhongMaterial({ color: 0xdddddd, shininess: 100 });
    const shackle = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.02, 16, 32, Math.PI), shackleMat);
    shackle.position.set(0, 0.15, 0);
    padlockGroup.add(shackle);

    function createDigitTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1280;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#e5e5e5';
      ctx.fillRect(0, 0, 1280, 128);

      ctx.fillStyle = '#000000';
      ctx.font = 'Bold 70px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < 10; i++) {
        ctx.save();
        ctx.translate(i * 128 + 64, 64);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(i.toString(), 0, 0);
        ctx.restore();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.offset.x = -0.05;
      return texture;
    }

    const wheels = [];
    const currentDigits = [0, 0, 0, 0];
    const SECRET_CODE = "4207";
    const digitTexture = createDigitTexture();
    const wheelGeo = new THREE.CylinderGeometry(0.051, 0.051, 0.08, 32);

    for (let i = 0; i < 4; i++) {
      const wheelMat = new THREE.MeshPhongMaterial({ map: digitTexture, shininess: 20 });
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.rotation.y = 0;
      wheel.position.x = -0.18 + i * 0.12;
      wheel.userData = { index: i };
      padlockGroup.add(wheel);
      wheels.push(wheel);
    }

    // 4. ANNEAU VISUEL DE DÉTECTION (HIT-TEST)
    const reticleGeo = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
    const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    const reticle = new THREE.Mesh(reticleGeo, reticleMat);
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    let hitTestSource = null;
    let hitTestSourceRequested = false;

    // 5. LOGIQUE MÉCANIQUE
    function rotateWheel(index) {
      unlockAudio();
      currentDigits[index] = (currentDigits[index] + 1) % 10;
      wheels[index].rotation.y = -(currentDigits[index] * (Math.PI * 2 / 10));

      if (positionalClick.isPlaying) positionalClick.stop();
      positionalClick.play();

      checkCode();
    }

    function checkCode() {
      if (currentDigits.join('') === SECRET_CODE) {
        shackle.position.y = 0.28;
        bodyMat.color.setHex(0x228b22);
        const info = document.getElementById('info');
        info.textContent = "CADENAS DÉVERROUILLÉ !";
        info.style.color = "#00ff00";

        if (positionalSuccess.isPlaying) positionalSuccess.stop();
        positionalSuccess.play();
      }
    }

    // 6. RAYCASTING & CONTRÔLEURS
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Tap classique (hors AR)
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;

      unlockAudio();
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(wheels);
      if (intersects.length > 0) {
        rotateWheel(intersects[0].object.userData.index);
      }
    });

    // Tap en mode AR
    const controller = renderer.xr.getController(0);
    controller.addEventListener('select', () => {
      unlockAudio();

      if (reticle.visible) {
        padlockGroup.position.setFromMatrixPosition(reticle.matrix);
      } else {
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);
        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        const intersects = raycaster.intersectObjects(wheels);
        if (intersects.length > 0) {
          rotateWheel(intersects[0].object.userData.index);
        }
      }
    });
    scene.add(controller);

    // 7. GESTES TACTILES SÉCURISÉS
    let previousTouch = null;
    let initialPinchDistance = null;
    let initialScale = 1;

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('button')) return;

      if (e.touches.length === 1) {
        previousTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        previousTouch = null;
        initialPinchDistance = getTouchDistance(e.touches);
        initialScale = padlockGroup.scale.x;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.target.closest('button')) return;

      if (e.touches.length === 1 && previousTouch) {
        const deltaX = e.touches[0].clientX - previousTouch.x;
        padlockGroup.rotation.y += deltaX * 0.008;
        previousTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = getTouchDistance(e.touches);
        const factor = currentDistance / initialPinchDistance;
        const newScale = Math.min(Math.max(initialScale * factor, 0.2), 3.0);
        padlockGroup.scale.set(newScale, newScale, newScale);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
      if (e.touches.length === 0) previousTouch = null;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 8. BOUCLE D'ANIMATION ET DIAGNOSTIC WEBXR
    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame) {
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            }).catch((err) => {
              console.warn("Hit-test non supporté sur cet appareil:", err);
            });
          }).catch(() => {});

          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const referenceSpace = renderer.xr.getReferenceSpace();
            const hitPose = hit.getPose(referenceSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(hitPose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
