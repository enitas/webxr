<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Test Escape Game WebXR - Cadenas 3D</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      color: #ffffff;
      z-index: 10;
      pointer-events: none;
      font-size: 15px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
  </style>

  <!-- Importmap pour Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">Touchez les molettes pour composer le code SECRET (4207)</div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    // 1. Scène, Caméra et Moteur de rendu
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 0.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Bouton AR WebXR pour mobile
    document.body.appendChild(ARButton.createButton(renderer));

    // Éclairage
    const light = new THREE.DirectionalLight(0xffffff, 2.5);
    light.position.set(1, 3, 2);
    scene.add(light, new THREE.AmbientLight(0xffffff, 0.8));

    // 2. Écouteur Audio Spatialisé
    const listener = new THREE.AudioListener();
    camera.add(listener);

    function unlockAudio() {
      if (listener.context.state === 'suspended') {
        listener.context.resume();
      }
    }

    function createClickBuffer(audioCtx) {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * 0.05, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / sampleRate;
        data[i] = Math.sin(2 * Math.PI * 200 * t) * Math.exp(-t * 90);
      }
      return buffer;
    }

    function createSuccessBuffer(audioCtx) {
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * 0.35, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const t = i / sampleRate;
        const freq = 440 + (t / 0.35) * 440;
        data[i] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-t * 6);
      }
      return buffer;
    }

    const positionalClick = new THREE.PositionalAudio(listener);
    const positionalSuccess = new THREE.PositionalAudio(listener);

    positionalClick.setBuffer(createClickBuffer(listener.context));
    positionalClick.setRefDistance(0.5);
    positionalClick.setRolloffFactor(2);

    positionalSuccess.setBuffer(createSuccessBuffer(listener.context));
    positionalSuccess.setRefDistance(0.5);
    positionalSuccess.setRolloffFactor(2);

    // 3. Construction du Cadenas
    const padlockGroup = new THREE.Group();
    padlockGroup.position.set(0, 0, -0.6);
    scene.add(padlockGroup);

    padlockGroup.add(positionalClick);
    padlockGroup.add(positionalSuccess);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.15), bodyMat);
    padlockGroup.add(body);

    const shackleMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9, roughness: 0.1 });
    const shackle = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.02, 16, 32, Math.PI), shackleMat);
    shackle.position.set(0, 0.15, 0);
    padlockGroup.add(shackle);

    // Texture horizontale avec chiffres orientés à 90° pour s'aligner sur les molettes
    function createDigitTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1280; // 10 chiffres x 128px autour de la circonférence
      canvas.height = 128; // Largeur de la molette
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 1280, 128);

      ctx.fillStyle = '#000000';
      ctx.font = 'Bold 70px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < 10; i++) {
        ctx.save();
        ctx.translate(i * 128 + 64, 64);
        ctx.rotate(-Math.PI / 2); // Pivote le texte pour qu'il soit droit face à la caméra
        ctx.fillText(i.toString(), 0, 0);
        ctx.restore();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.offset.x = -0.05; // Ajustement du centrage du chiffre 0
      return texture;
    }

    const wheels = [];
    const currentDigits = [0, 0, 0, 0];
    const SECRET_CODE = "4207";
    const digitTexture = createDigitTexture();
    const wheelGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.08, 32);

    for (let i = 0; i < 4; i++) {
      const wheelMat = new THREE.MeshStandardMaterial({ map: digitTexture, roughness: 0.3 });
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.rotation.y = 0;
      wheel.position.x = -0.18 + i * 0.12;
      wheel.userData = { index: i };
      padlockGroup.add(wheel);
      wheels.push(wheel);
    }

    // 4. Logique de rotation & Déverrouillage
    function rotateWheel(index) {
      unlockAudio();
      currentDigits[index] = (currentDigits[index] + 1) % 10;
      
      // Rotation sur l'axe Y local de la molette pour défiler les chiffres
      wheels[index].rotation.y = -(currentDigits[index] * (Math.PI * 2 / 10));

      if (positionalClick.isPlaying) positionalClick.stop();
      positionalClick.play();

      checkCode();
    }

    function checkCode() {
      if (currentDigits.join('') === SECRET_CODE) {
        shackle.position.y = 0.28;
        bodyMat.color.setHex(0x228b22);
        const info = document.getElementById('info');
        info.textContent = "CADENAS DÉVERROUILLÉ !";
        info.style.color = "#00ff00";

        if (positionalSuccess.isPlaying) positionalSuccess.stop();
        positionalSuccess.play();
      }
    }

    // 5. Interactions (Tactile mobile & WebXR)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      // Éviter de déclencher un clic si on appuie sur le bouton AR
      if (e.target.tagName === 'BUTTON') return;

      unlockAudio();
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(wheels);
      if (intersects.length > 0) {
        rotateWheel(intersects[0].object.userData.index);
      }
    });

    const controller = renderer.xr.getController(0);
    controller.addEventListener('select', () => {
      unlockAudio();
      const tempMatrix = new THREE.Matrix4();
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const intersects = raycaster.intersectObjects(wheels);
      if (intersects.length > 0) {
        rotateWheel(intersects[0].object.userData.index);
      }
    });
    scene.add(controller);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. Boucle de rendu WebXR
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
